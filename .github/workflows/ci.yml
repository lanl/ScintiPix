name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: 0.52.0
          cache: true

      - name: Install locked environment
        run: pixi install

      - name: Check lockfile
        run: pixi lock --check

      - name: Check environment
        run: pixi run check-environment

      - name: Build simulator
        run: pixi run build-sim

      - name: Run Python tests
        run: pixi run test-python

      - name: Run native tests
        run: pixi run test-sim
